<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIM LAB — 에임 & 반응 속도 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a38;
    --text: #e8e8f0;
    --text-muted: #6b6b80;
    --accent: #4fffb0;
    --accent2: #ff4f6b;
    --accent3: #4fa8ff;
    --accent4: #ffb84f;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(circle at 50% 0%, #1a1a24 0%, var(--bg) 100%); /* 배경에 은은한 깊이감 추가 */
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ─── HEADER ─── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(12px);
  }
  .logo {
    font-family: var(--mono);
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent);
  }
  .logo span { color: var(--text-muted); font-weight: 400; }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .best-badge {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 4px;
    display: none;
  }

  /* ─── MAIN LAYOUT ─── */
  main { max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; }

  /* ─── SECTION TITLES ─── */
  .section-title {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* ─── MODE SELECTOR ─── */
  .mode-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 40px;
  }
  .mode-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px; /* 모서리 살짝 더 둥글게 */
    padding: 20px 16px;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
    user-select: none;
  }
  .mode-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .mode-card.reaction::before { background: linear-gradient(135deg, rgba(79,255,176,0.06), transparent); }
  .mode-card.flick::before    { background: linear-gradient(135deg, rgba(255,79,107,0.06), transparent); }
  .mode-card.tracking::before { background: linear-gradient(135deg, rgba(79,168,255,0.06), transparent); }

  .mode-card:hover { 
    border-color: #3a3a4a; 
    background: var(--surface2);
    transform: translateY(-2px); /* 호버 시 살짝 떠오르는 효과 */
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); 
  }
  .mode-card:hover::before { opacity: 1; }
  .mode-card.active.reaction { border-color: var(--accent); box-shadow: 0 0 20px rgba(79,255,176,0.1); }
  .mode-card.active.flick    { border-color: var(--accent2); box-shadow: 0 0 20px rgba(255,79,107,0.1); }
  .mode-card.active.tracking { border-color: var(--accent3); box-shadow: 0 0 20px rgba(79,168,255,0.1); }
  .mode-card.active::before  { opacity: 1; }

  .mode-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
    font-size: 1.1rem;
  }
  .reaction .mode-icon { background: rgba(79,255,176,0.12); }
  .flick .mode-icon    { background: rgba(255,79,107,0.12); }
  .tracking .mode-icon { background: rgba(79,168,255,0.12); }

  .mode-name {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--text);
  }
  .mode-desc {
    font-size: 0.72rem;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .mode-best {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--text-muted);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .reaction .mode-best span { color: var(--accent); }
  .flick .mode-best span    { color: var(--accent2); }
  .tracking .mode-best span { color: var(--accent3); }

  /* ─── SETTINGS ─── */
  .settings-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .setting-group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
  }
  .setting-label {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-family: var(--mono);
  }
  .setting-select {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.75rem;
    cursor: pointer;
    outline: none;
    appearance: none;
    padding-right: 4px;
  }
  .setting-select option { background: var(--surface2); color: var(--text); }

  /* ─── START BUTTON ─── */
  .btn-start {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #0a0a0f;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
    text-transform: uppercase;
  }
  .btn-start:hover { 
    opacity: 0.9; 
    box-shadow: 0 0 15px rgba(79, 255, 176, 0.4); /* 버튼 고유색 발광 효과 */
  }
  .btn-start:active { transform: scale(0.98); }
  .btn-start.flick-btn { background: var(--accent2); }
  .btn-start.flick-btn:hover { box-shadow: 0 0 15px rgba(255, 79, 107, 0.4); }
  .btn-start.tracking-btn { background: var(--accent3); }
  .btn-start.tracking-btn:hover { box-shadow: 0 0 15px rgba(79, 168, 255, 0.4); }

  /* ─── TEST AREA ─── */
  #test-area {
    display: none;
    flex-direction: column;
    gap: 16px;
  }
  #test-area.visible { display: flex; }

  .test-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .test-title {
    font-family: var(--mono);
    font-size: 0.85rem;
    font-weight: 700;
  }
  .reaction-title { color: var(--accent); }
  .flick-title    { color: var(--accent2); }
  .tracking-title { color: var(--accent3); }

  .test-stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .stat-item {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-muted);
  }
  .stat-item span {
    color: var(--text);
    font-weight: 700;
  }

  .btn-stop {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 0.7rem;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-stop:hover { border-color: var(--accent2); color: var(--accent2); }

  /* ─── REACTION TEST ─── */
  #reaction-box {
    width: 100%;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
    flex-direction: column;
    gap: 8px;
    position: relative;
    overflow: hidden;
    min-height: 320px;
  }
  .reaction-label {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.8;
  }
  .reaction-time {
    font-family: var(--mono);
    font-size: 3rem;
    font-weight: 700;
    line-height: 1;
  }
  .reaction-hint {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
  }

  /* ─── REACTION HISTORY ─── */
  .reaction-history {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .hist-chip {
    font-family: var(--mono);
    font-size: 0.7rem;
    padding: 4px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-muted);
  }
  .hist-chip.best { border-color: var(--accent); color: var(--accent); }

  /* ─── CANVAS TESTS ─── */
  #flick-canvas, #tracking-canvas {
    width: 100%;
    border-radius: 12px;
    display: block;
    cursor: crosshair;
    border: 1px solid var(--border);
    touch-action: none; /* 추가: 모바일 스와이프/스크롤 방지 */
  }

  /* ─── RESULTS ─── */
  #result-area {
    display: none;
  }
  #result-area.visible { display: block; }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    margin-bottom: 16px;
  }
  .result-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .result-mode-name {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 6px;
  }
  .result-score {
    font-family: var(--mono);
    font-size: 2.5rem;
    font-weight: 700;
    line-height: 1;
  }
  .result-score.reaction-color { color: var(--accent); }
  .result-score.flick-color    { color: var(--accent2); }
  .result-score.tracking-color { color: var(--accent3); }
  .result-unit {
    font-size: 1rem;
    font-weight: 400;
    color: var(--text-muted);
    margin-left: 4px;
  }

  /* ─── TIER ─── */
  .tier-badge {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .tier-name {
    font-family: var(--mono);
    font-size: 1.2rem;
    font-weight: 700;
  }
  .tier-percentile {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-family: var(--mono);
  }
  .tier-bronze   { color: #cd7f32; }
  .tier-silver   { color: #c0c0c0; }
  .tier-gold     { color: #ffd700; }
  .tier-platinum { color: #70e0e0; }
  .tier-diamond  { color: #b9f2ff; }
  .tier-master   { color: var(--accent); }

  .result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .result-metric {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }
  .metric-label {
    font-size: 0.68rem;
    color: var(--text-muted);
    font-family: var(--mono);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .metric-value {
    font-family: var(--mono);
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }
  .metric-new {
    font-size: 0.6rem;
    color: var(--accent4);
    font-family: var(--mono);
    margin-left: 4px;
    animation: blink 1s infinite;
  }
  @keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* ─── BAR ─── */
  .result-bar-wrap {
    margin-top: 4px;
  }
  .result-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--text-muted);
    font-family: var(--mono);
    margin-bottom: 6px;
  }
  .result-bar-bg {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }
  .result-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .reaction-fill { background: linear-gradient(90deg, var(--accent), #00c080); }
  .flick-fill    { background: linear-gradient(90deg, var(--accent2), #c0002a); }
  .tracking-fill { background: linear-gradient(90deg, var(--accent3), #0070c0); }

  .result-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .btn-retry {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 0.75rem;
    cursor: pointer;
    transition: border-color 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .btn-retry:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── HOME ─── */
  #home-area { display: block; }
  #home-area.hidden { display: none; }

  /* ─── PROGRESS DOTS ─── */
  .progress-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 8px;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s;
  }
  .dot.done { background: var(--accent); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 600px) {
    header { padding: 16px 20px; }
    main { padding: 24px 16px 60px; }
    .mode-grid { grid-template-columns: 1fr; }
    .reaction-time { font-size: 2.2rem; }
    #reaction-box { min-height: 240px; }
    .result-card { padding: 20px; }
    .result-score { font-size: 1.9rem; }
    .mode-name { font-size: 0.8rem; }
    .mode-desc { font-size: 0.68rem; }
  }

  /* ─── FLICK TARGET GLOW ─── */
  .canvas-container { position: relative; }

  /* ─── TOAST ─── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 20px;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text);
    z-index: 9999;
    transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ─── COUNTDOWN ─── */
  .countdown-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10,10,15,0.85);
    border-radius: 12px;
    z-index: 10;
    font-family: var(--mono);
    font-size: 4rem;
    font-weight: 700;
    color: var(--accent);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .countdown-overlay.visible { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">AIM<span>/</span>LAB</div>
  <div class="header-right">
    <div class="best-badge" id="global-best">베스트 기록 저장됨</div>
  </div>
</header>

<main>

  <!-- HOME -->
  <div id="home-area">
    <p class="section-title">// 테스트 모드 선택</p>
    <div class="mode-grid">
      <div class="mode-card reaction" id="card-reaction" onclick="selectMode('reaction')">
        <div class="mode-icon">⚡</div>
        <div class="mode-name">시각 반응 테스트</div>
        <div class="mode-desc">색상 변화를 감지하고 최대한 빠르게 클릭</div>
        <div class="mode-best">최고 기록: <span id="best-reaction">—</span></div>
      </div>
      <div class="mode-card flick" id="card-flick" onclick="selectMode('flick')">
        <div class="mode-icon">🎯</div>
        <div class="mode-name">플릭 에임 테스트</div>
        <div class="mode-desc">무작위 표적을 빠르고 정확하게 클릭</div>
        <div class="mode-best">최고 기록: <span id="best-flick">—</span></div>
      </div>
      <div class="mode-card tracking" id="card-tracking" onclick="selectMode('tracking')">
        <div class="mode-icon">🔵</div>
        <div class="mode-name">트래킹 테스트</div>
        <div class="mode-desc">움직이는 원 위에 커서를 최대한 오래 유지</div>
        <div class="mode-best">최고 기록: <span id="best-tracking">—</span></div>
      </div>
    </div>

    <div id="settings-row" class="settings-row" style="display:none">
      <div class="setting-group" id="sg-rounds" style="display:none">
        <span class="setting-label">ROUNDS</span>
        <select class="setting-select" id="sel-rounds">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
        </select>
      </div>
      <div class="setting-group" id="sg-duration" style="display:none">
        <span class="setting-label">TIME</span>
        <select class="setting-select" id="sel-duration">
          <option value="15">15s</option>
          <option value="30" selected>30s</option>
          <option value="60">60s</option>
        </select>
      </div>
      <div class="setting-group" id="sg-difficulty" style="display:none">
        <span class="setting-label">DIFFICULTY</span>
        <select class="setting-select" id="sel-difficulty">
          <option value="easy">EASY</option>
          <option value="normal" selected>NORMAL</option>
          <option value="hard">HARD</option>
        </select>
      </div>
      <button class="btn-start" id="btn-start" onclick="startTest()">START</button>
    </div>
  </div>

  <!-- TEST AREA -->
  <div id="test-area">

    <!-- REACTION TEST -->
    <div id="reaction-test" style="display:none">
      <div class="test-header">
        <span class="test-title reaction-title">// 시각 반응 테스트</span>
        <div class="test-stats">
          <div class="stat-item">라운드 <span id="r-round">0</span>/<span id="r-total">10</span></div>
          <div class="stat-item">평균 <span id="r-avg">—</span>ms</div>
        </div>
        <button class="btn-stop" onclick="stopTest()">중단</button>
      </div>
      <div id="reaction-box" onclick="reactionClick()">
        <div class="reaction-label" id="r-label">준비 중...</div>
        <div class="reaction-time" id="r-time" style="display:none"></div>
        <div class="reaction-hint" id="r-hint"></div>
      </div>
      <div class="reaction-history" id="r-history"></div>
    </div>

    <!-- FLICK TEST -->
    <div id="flick-test" style="display:none">
      <div class="test-header">
        <span class="test-title flick-title">// 플릭 에임 테스트</span>
        <div class="test-stats">
          <div class="stat-item">HIT <span id="f-hits">0</span>/<span id="f-total">0</span></div>
          <div class="stat-item">시간 <span id="f-time">00:30</span></div>
          <div class="stat-item">명중률 <span id="f-acc">—</span>%</div>
        </div>
        <button class="btn-stop" onclick="stopTest()">중단</button>
      </div>
      <div class="canvas-container">
        <canvas id="flick-canvas"></canvas>
        <div class="countdown-overlay" id="flick-countdown">3</div>
      </div>
    </div>

    <!-- TRACKING TEST -->
    <div id="tracking-test" style="display:none">
      <div class="test-header">
        <span class="test-title tracking-title">// 트래킹 테스트</span>
        <div class="test-stats">
          <div class="stat-item">트래킹 <span id="t-pct">0</span>%</div>
          <div class="stat-item">시간 <span id="t-time">00:30</span></div>
        </div>
        <button class="btn-stop" onclick="stopTest()">중단</button>
      </div>
      <div class="canvas-container">
        <canvas id="tracking-canvas"></canvas>
        <div class="countdown-overlay" id="tracking-countdown">3</div>
      </div>
      <div class="progress-dots" id="t-dots"></div>
    </div>

  </div>

  <!-- RESULT AREA -->
  <div id="result-area">
    <div class="result-card" id="result-card">
      <!-- populated by JS -->
    </div>
    <div class="result-actions">
      <button class="btn-retry" id="btn-retry" onclick="retryTest()">다시 시도</button>
      <button class="btn-retry" onclick="goHome()">홈으로</button>
    </div>
  </div>

</main>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════
   GLOBAL STATE
══════════════════════════════════════════════════════ */
let currentMode = null;
let testRunning = false;

/* LocalStorage helpers */
const LS = {
  get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* ══════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════ */
function init() {
  updateBestDisplay();
}

function updateBestDisplay() {
  const rb = LS.get('best_reaction');
  const fb = LS.get('best_flick');
  const tb = LS.get('best_tracking');
  document.getElementById('best-reaction').textContent = rb ? rb.toFixed(1) + 'ms' : '—';
  document.getElementById('best-flick').textContent    = fb !== null ? fb + '개' : '—';
  document.getElementById('best-tracking').textContent = tb !== null ? tb + '%' : '—';
}

/* ══════════════════════════════════════════════════════
   MODE SELECTION
══════════════════════════════════════════════════════ */
function selectMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
  document.getElementById('card-' + mode).classList.add('active');

  const sr = document.getElementById('settings-row');
  sr.style.display = 'flex';

  const sgRounds   = document.getElementById('sg-rounds');
  const sgDuration = document.getElementById('sg-duration');
  const sgDiff     = document.getElementById('sg-difficulty');
  const btn        = document.getElementById('btn-start');

  sgRounds.style.display   = 'none';
  sgDuration.style.display = 'none';
  sgDiff.style.display     = 'none';

  if (mode === 'reaction') {
    sgRounds.style.display = 'flex';
    btn.className = 'btn-start';
  } else if (mode === 'flick') {
    sgDuration.style.display = 'flex';
    sgDiff.style.display = 'flex';
    btn.className = 'btn-start flick-btn';
  } else if (mode === 'tracking') {
    sgDuration.style.display = 'flex';
    sgDiff.style.display = 'flex';
    btn.className = 'btn-start tracking-btn';
  }
}

/* ══════════════════════════════════════════════════════
   START / STOP
══════════════════════════════════════════════════════ */
function startTest() {
  if (!currentMode) return;
  document.getElementById('home-area').classList.add('hidden');
  document.getElementById('test-area').classList.add('visible');
  document.getElementById('result-area').classList.remove('visible');
  testRunning = true;

  if (currentMode === 'reaction') startReaction();
  else if (currentMode === 'flick') startFlick();
  else if (currentMode === 'tracking') startTracking();
}

function stopTest() {
  testRunning = false;
  if (currentMode === 'reaction') stopReaction();
  else if (currentMode === 'flick') stopFlick();
  else if (currentMode === 'tracking') stopTracking();
  showHome();
}

function goHome() {
  document.getElementById('result-area').classList.remove('visible');
  showHome();
}

function retryTest() {
  document.getElementById('result-area').classList.remove('visible');
  document.getElementById('test-area').classList.remove('visible');
  startTest();
}

function showHome() {
  document.getElementById('home-area').classList.remove('hidden');
  document.getElementById('test-area').classList.remove('visible');
  testRunning = false;
  updateBestDisplay();
}

/* ══════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════ */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ══════════════════════════════════════════════════════
   ① REACTION TEST
══════════════════════════════════════════════════════ */
let reactionState = 'idle'; // idle | waiting | ready | result | finished
let reactionTimer = null;
let reactionStart = 0;
let reactionResults = [];
let reactionTotal = 10;
let reactionCurrent = 0;

function startReaction() {
  reactionTotal = parseInt(document.getElementById('sel-rounds').value);
  reactionResults = [];
  reactionCurrent = 0;

  document.getElementById('reaction-test').style.display = 'block';
  document.getElementById('flick-test').style.display = 'none';
  document.getElementById('tracking-test').style.display = 'none';
  document.getElementById('r-total').textContent = reactionTotal;
  document.getElementById('r-history').innerHTML = '';

  reactionNextRound();
}

function reactionNextRound() {
  if (!testRunning) return;
  reactionState = 'waiting';
  const box = document.getElementById('reaction-box');
  const label = document.getElementById('r-label');
  const timeEl = document.getElementById('r-time');
  const hint = document.getElementById('r-hint');

  box.style.background = '#1a1a24';
  box.style.cursor = 'pointer';
  label.textContent = '잠깐 기다리세요...';
  label.style.color = 'rgba(255,255,255,0.5)';
  timeEl.style.display = 'none';
  hint.textContent = '';

  document.getElementById('r-round').textContent = reactionCurrent + 1;

  const delay = 1500 + Math.random() * 3000;
  reactionTimer = setTimeout(() => {
    if (!testRunning || reactionState !== 'waiting') return;
    reactionState = 'ready';
    box.style.background = '#1a4a2a';
    label.textContent = '지금 클릭!';
    label.style.color = 'var(--accent)';
    hint.textContent = '최대한 빠르게!';
    // 렌더링 타이밍에 맞춰 더 정확한 시작 시간을 기록합니다.
    requestAnimationFrame(() => {
      reactionStart = performance.now();
    });
  }, delay);
}

function reactionClick() {
  if (!testRunning) return;
  const now = performance.now();

  if (reactionState === 'waiting') {
    clearTimeout(reactionTimer);
    reactionState = 'early';
    const box = document.getElementById('reaction-box');
    box.style.background = '#4a1a1a';
    document.getElementById('r-label').textContent = '너무 빨랐습니다!';
    document.getElementById('r-label').style.color = 'var(--accent2)';
    document.getElementById('r-hint').textContent = '클릭하여 다시 시도';
    setTimeout(() => { if (testRunning) reactionNextRound(); }, 1000);
    return;
  }

  if (reactionState === 'ready') {
    const ms = now - reactionStart; // 반올림 제거 (정밀도 향상)
    reactionState = 'result';
    reactionCurrent++;
    reactionResults.push(ms);

    const box = document.getElementById('reaction-box');
    box.style.background = '#12121e';
    document.getElementById('r-label').textContent = '반응 속도';
    document.getElementById('r-label').style.color = 'var(--accent)';
    const timeEl = document.getElementById('r-time');
    timeEl.style.display = 'block';
    timeEl.textContent = ms.toFixed(1) + 'ms'; // 소수점 1자리 표기
    timeEl.style.color = ms < 200 ? 'var(--accent)' : ms < 300 ? 'var(--accent4)' : 'var(--accent2)';
    document.getElementById('r-hint').textContent = reactionCurrent < reactionTotal ? '클릭하여 계속' : '';

    // avg
    const avg = reactionResults.reduce((a,b)=>a+b,0)/reactionResults.length;
    document.getElementById('r-avg').textContent = avg.toFixed(1);

    // history chip
    const hist = document.getElementById('r-history');
    const min = Math.min(...reactionResults);
    const chip = document.createElement('div');
    chip.className = 'hist-chip' + (ms === min ? ' best' : '');
    chip.textContent = ms.toFixed(1) + 'ms';
    hist.appendChild(chip);

    if (reactionCurrent >= reactionTotal) {
      setTimeout(() => { if (testRunning) finishReaction(); }, 800);
    } else {
      reactionState = 'between';
    }
    return;
  }

  if (reactionState === 'between') {
    reactionNextRound();
  }
}

function stopReaction() {
  clearTimeout(reactionTimer);
  reactionState = 'idle';
}

function finishReaction() {
  testRunning = false;
  const avg = reactionResults.reduce((a,b)=>a+b,0)/reactionResults.length;
  const best = Math.min(...reactionResults);
  const worst = Math.max(...reactionResults);

  // Save best (버그 수정: 기록이 없을 경우 null 확인)
  const prevBest = LS.get('best_reaction');
  const isNewBest = prevBest === null || avg < prevBest;
  if (isNewBest) LS.set('best_reaction', avg);

  // Tier (lower = better for reaction)
  // avg ms -> percentile mapping
  function reactionTier(ms) {
    if (ms <= 165) return { tier: 'MASTER',   pct: '상위 1%',   cls: 'tier-master' };
    if (ms <= 185) return { tier: 'DIAMOND',  pct: '상위 5%',   cls: 'tier-diamond' };
    if (ms <= 210) return { tier: 'PLATINUM', pct: '상위 15%',  cls: 'tier-platinum' };
    if (ms <= 240) return { tier: 'GOLD',     pct: '상위 35%',  cls: 'tier-gold' };
    if (ms <= 280) return { tier: 'SILVER',   pct: '상위 65%',  cls: 'tier-silver' };
    return             { tier: 'BRONZE',   pct: '하위 35%',  cls: 'tier-bronze' };
  }

  const t = reactionTier(avg);
  const barPct = Math.max(0, Math.min(100, Math.round((400 - avg) / 300 * 100)));

  showResult({
    modeName: '시각 반응 테스트',
    score: avg.toFixed(1),
    unit: 'ms',
    scoreClass: 'reaction-color',
    tier: t,
    isNewBest,
    barPct,
    barClass: 'reaction-fill',
    metrics: [
      { label: 'AVERAGE', value: avg.toFixed(1) + 'ms', new: isNewBest },
      { label: 'BEST',    value: best.toFixed(1) + 'ms' },
      { label: 'WORST',   value: worst.toFixed(1) + 'ms' },
      { label: 'SAMPLES', value: reactionResults.length + '회' },
    ],
    barLabel: { left: '빠름 (< 160ms)', right: '느림 (> 400ms)' }
  });
}

/* ══════════════════════════════════════════════════════
   ② FLICK AIM TEST
══════════════════════════════════════════════════════ */
let flickCanvas, flickCtx;
let flickAnimId = null;
let flickRunning = false;
let flickTargets = [];
let flickHits = 0;
let flickMisses = 0;
let flickDuration = 30;
let flickEndTime = 0;
let flickDifficulty = 'normal';
let flickCountdownVal = 3;
let flickCountdownTimer = null;
let flickParticles = [];

const FLICK_DIFFICULTY = {
  easy:   { minR: 28, maxR: 42, minLife: 2200, maxLife: 3200 },
  normal: { minR: 18, maxR: 30, minLife: 1400, maxLife: 2400 },
  hard:   { minR: 12, maxR: 20, minLife: 800,  maxLife: 1600 },
};

function startFlick() {
  flickDuration   = parseInt(document.getElementById('sel-duration').value);
  flickDifficulty = document.getElementById('sel-difficulty').value;
  flickHits = 0; flickMisses = 0;
  flickTargets = []; flickParticles = [];

  document.getElementById('reaction-test').style.display  = 'none';
  document.getElementById('flick-test').style.display     = 'block';
  document.getElementById('tracking-test').style.display  = 'none';

  document.getElementById('f-hits').textContent  = '0';
  document.getElementById('f-total').textContent = '0';
  document.getElementById('f-acc').textContent   = '—';
  document.getElementById('f-time').textContent  = '00:' + String(flickDuration).padStart(2,'0');

  flickCanvas = document.getElementById('flick-canvas');
  resizeFlickCanvas();
  flickCtx = flickCanvas.getContext('2d');

  // click 대신 pointerdown 이벤트 사용 (모바일 지연 제거)
  flickCanvas.addEventListener('pointerdown', flickCanvasClick);
  window.addEventListener('resize', resizeFlickCanvas);

  // Countdown
  flickRunning = false;
  flickCountdownVal = 3;
  const overlay = document.getElementById('flick-countdown');
  overlay.textContent = '3';
  overlay.classList.add('visible');

  flickCountdownTimer = setInterval(() => {
    flickCountdownVal--;
    if (flickCountdownVal <= 0) {
      clearInterval(flickCountdownTimer);
      overlay.classList.remove('visible');
      flickRunning = true;
      flickEndTime = performance.now() + flickDuration * 1000;
      spawnFlickTarget();
      flickLoop();
    } else {
      overlay.textContent = flickCountdownVal;
    }
  }, 900);
}

function resizeFlickCanvas() {
  if (!flickCanvas) return;
  const w = flickCanvas.parentElement.clientWidth;
  const h = Math.min(w * 0.55, 420);
  flickCanvas.width  = w;
  flickCanvas.height = h;
  flickCanvas.style.height = h + 'px';
}

function spawnFlickTarget() {
  if (!flickRunning) return;
  const cfg = FLICK_DIFFICULTY[flickDifficulty];
  const r   = cfg.minR + Math.random() * (cfg.maxR - cfg.minR);
  const pad = r + 8;
  const x   = pad + Math.random() * (flickCanvas.width  - 2 * pad);
  const y   = pad + Math.random() * (flickCanvas.height - 2 * pad);
  const life = cfg.minLife + Math.random() * (cfg.maxLife - cfg.minLife);
  flickTargets.push({ x, y, r, born: performance.now(), life, pulse: 0 });
}

function flickCanvasClick(e) {
  if (!flickRunning) return;
  const rect = flickCanvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (flickCanvas.width / rect.width);
  const my = (e.clientY - rect.top)  * (flickCanvas.height / rect.height);

  let hit = false;
  flickTargets = flickTargets.filter(t => {
    const d = Math.hypot(mx - t.x, my - t.y);
    if (d <= t.r + 4 && !hit) {
      hit = true;
      flickHits++;
      // Particle burst
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        const speed = 2 + Math.random() * 3;
        flickParticles.push({
          x: t.x, y: t.y,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          life: 1, color: '#ff4f6b'
        });
      }
      return false;
    }
    return true;
  });

  if (!hit) {
    flickMisses++;
    // Miss particle
    flickParticles.push({ x: mx, y: my, vx: 0, vy: 0, life: 1, color: '#6b6b80', miss: true });
  }

  updateFlickUI();
  if (hit) spawnFlickTarget();
}

function updateFlickUI() {
  const total = flickHits + flickMisses;
  document.getElementById('f-hits').textContent  = flickHits;
  document.getElementById('f-total').textContent = total;
  document.getElementById('f-acc').textContent   = total ? Math.round(flickHits/total*100) : '—';
}

function flickLoop() {
  if (!flickRunning && !flickAnimId) return;
  flickAnimId = requestAnimationFrame(flickLoop);

  const now = performance.now();
  const remaining = Math.max(0, (flickEndTime - now) / 1000);
  const secs = Math.floor(remaining);
  const ms   = Math.floor((remaining - secs) * 100);
  document.getElementById('f-time').textContent =
    '0' + Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2,'0');

  // Remove expired targets
  const prevLen = flickTargets.length;
  flickTargets = flickTargets.filter(t => (now - t.born) < t.life);
  if (prevLen > flickTargets.length) {
    flickMisses += prevLen - flickTargets.length;
    updateFlickUI();
  }
  // Ensure at least 1 target
  if (flickTargets.length === 0 && flickRunning) spawnFlickTarget();
  // Add extra targets on hard
  if (flickDifficulty === 'hard' && flickTargets.length < 3 && flickRunning) spawnFlickTarget();
  if (flickDifficulty === 'normal' && flickTargets.length < 2 && flickRunning) spawnFlickTarget();

  drawFlick(now);

  if (remaining <= 0 && flickRunning) {
    flickRunning = false;
    cancelAnimationFrame(flickAnimId);
    flickAnimId = null;
    finishFlick();
  }
}

function drawFlick(now) {
  const ctx = flickCtx;
  const W = flickCanvas.width, H = flickCanvas.height;
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#111118';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Particles
  flickParticles = flickParticles.filter(p => p.life > 0);
  for (const p of flickParticles) {
    ctx.globalAlpha = p.life;
    if (p.miss) {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
      ctx.fill();
    }
    p.x += p.vx; p.y += p.vy;
    p.life -= 0.05;
  }
  ctx.globalAlpha = 1;

  // Targets
  for (const t of flickTargets) {
    const age = (now - t.born) / t.life;
    const fadeOut = age > 0.75 ? 1 - (age - 0.75) / 0.25 : 1;
    const pulse = Math.sin(now * 0.005) * 0.12 + 0.88;

    // Outer ring
    ctx.globalAlpha = fadeOut * 0.3;
    ctx.strokeStyle = '#ff4f6b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r * (1.3 + pulse * 0.15), 0, Math.PI*2);
    ctx.stroke();

    // Glow
    const grd = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, t.r);
    grd.addColorStop(0, 'rgba(255,79,107,0.5)');
    grd.addColorStop(0.6, 'rgba(255,79,107,0.2)');
    grd.addColorStop(1, 'rgba(255,79,107,0)');
    ctx.globalAlpha = fadeOut;
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
    ctx.fill();

    // Main circle
    ctx.globalAlpha = fadeOut;
    ctx.fillStyle = '#ff4f6b';
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r * 0.55, 0, Math.PI*2);
    ctx.fill();

    // Crosshair
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    ctx.globalAlpha = fadeOut * 0.8;
    const cl = t.r * 0.35;
    ctx.beginPath();
    ctx.moveTo(t.x - cl, t.y); ctx.lineTo(t.x + cl, t.y);
    ctx.moveTo(t.x, t.y - cl); ctx.lineTo(t.x, t.y + cl);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Time bar
  const timeLeft = Math.max(0, flickEndTime - now);
  const barW = (timeLeft / (flickDuration * 1000)) * W;
  ctx.fillStyle = 'rgba(255,79,107,0.25)';
  ctx.fillRect(0, H - 4, W, 4);
  ctx.fillStyle = '#ff4f6b';
  ctx.fillRect(0, H - 4, barW, 4);
}

function stopFlick() {
  flickRunning = false;
  clearInterval(flickCountdownTimer);
  if (flickAnimId) { cancelAnimationFrame(flickAnimId); flickAnimId = null; }
  flickCanvas && flickCanvas.removeEventListener('pointerdown', flickCanvasClick);
  window.removeEventListener('resize', resizeFlickCanvas);
}

function finishFlick() {
  flickCanvas.removeEventListener('pointerdown', flickCanvasClick);
  window.removeEventListener('resize', resizeFlickCanvas);

  const total = flickHits + flickMisses;
  const acc   = total ? Math.round(flickHits / total * 100) : 0;
  const hps   = +(flickHits / flickDuration).toFixed(2);

  // Save best (Hit 수 기반으로 변경)
  const prevBest = LS.get('best_flick');
  const isNewBest = prevBest === null || flickHits > prevBest;
  if (isNewBest) LS.set('best_flick', flickHits);

  // Tier를 HPS(초당 타격수) 기반으로 측정하여 시간 설정이 달라도 공정하게 처리
  function flickTier(h) {
    if (h >= 3.0) return { tier: 'MASTER',   pct: '상위 1%',  cls: 'tier-master' };
    if (h >= 2.5) return { tier: 'DIAMOND',  pct: '상위 5%',  cls: 'tier-diamond' };
    if (h >= 2.0) return { tier: 'PLATINUM', pct: '상위 15%', cls: 'tier-platinum' };
    if (h >= 1.5) return { tier: 'GOLD',     pct: '상위 35%', cls: 'tier-gold' };
    if (h >= 1.0) return { tier: 'SILVER',   pct: '상위 65%', cls: 'tier-silver' };
    return             { tier: 'BRONZE',   pct: '하위 35%', cls: 'tier-bronze' };
  }

  const t = flickTier(hps);
  const barPct = Math.min(100, (hps / 3.5) * 100);

  showResult({
    modeName: '플릭 에임 테스트',
    score: flickHits,
    unit: '개',
    scoreClass: 'flick-color',
    tier: t,
    isNewBest,
    barPct: barPct,
    barClass: 'flick-fill',
    metrics: [
      { label: 'HITS',     value: flickHits + '개', new: isNewBest },
      { label: 'ACCURACY', value: acc + '%' },
      { label: 'MISSES',   value: flickMisses + '회' },
      { label: 'HIT/SEC',  value: hps + '/s' },
    ],
    barLabel: { left: '느림', right: '빠름 (3.5+ HPS)' }
  });
}

/* ══════════════════════════════════════════════════════
   ③ TRACKING TEST
══════════════════════════════════════════════════════ */
let trackCanvas, trackCtx;
let trackAnimId = null;
let trackRunning = false;
let trackDuration = 30;
let trackEndTime = 0;
let trackOnTarget = 0;
let trackTotal    = 0;
let trackDifficulty = 'normal';
let trackCountdownVal = 3;
let trackCountdownTimer = null;

// 각도와 목표 각도를 추가하여 부드러운 회전을 구현합니다.
let trackTarget = { x: 0, y: 0, r: 30, vx: 0, vy: 0, angle: 0, targetAngle: 0, speed: 0 };
let trackMouse  = { x: -999, y: -999 };
let trackOnNow  = false;
let trackTrail  = [];

// 트래킹 난이도: 떨림(wobble)을 시각적 효과 수준으로 낮추고 속도 안정화
const TRACK_DIFFICULTY = {
  easy:   { speed: 1.2, r: 45, wobble: 0.005 },
  normal: { speed: 2.0, r: 35, wobble: 0.010 },
  hard:   { speed: 3.0, r: 25, wobble: 0.015 },
};

function startTracking() {
  trackDuration   = parseInt(document.getElementById('sel-duration').value);
  trackDifficulty = document.getElementById('sel-difficulty').value;
  trackOnTarget = 0; trackTotal = 0;
  trackTrail = [];

  document.getElementById('reaction-test').style.display  = 'none';
  document.getElementById('flick-test').style.display     = 'none';
  document.getElementById('tracking-test').style.display  = 'block';

  document.getElementById('t-pct').textContent = '0';
  document.getElementById('t-time').textContent = '00:' + String(trackDuration).padStart(2,'0');

  // Progress dots
  const dots = document.getElementById('t-dots');
  dots.innerHTML = '';

  trackCanvas = document.getElementById('tracking-canvas');
  resizeTrackCanvas();
  trackCtx = trackCanvas.getContext('2d');

  const cfg = TRACK_DIFFICULTY[trackDifficulty];
  trackTarget.r  = cfg.r;
  trackTarget.x  = trackCanvas.width  / 2;
  trackTarget.y  = trackCanvas.height / 2;

  // 초기 각도 설정
  trackTarget.angle = Math.random() * Math.PI * 2;
  trackTarget.targetAngle = trackTarget.angle;
  trackTarget.speed = cfg.speed;

  // pointer 이벤트로 마우스와 터치를 통합 처리
  trackCanvas.addEventListener('pointerdown', trackPointerMove);
  trackCanvas.addEventListener('pointermove', trackPointerMove);
  window.addEventListener('resize', resizeTrackCanvas);

  // Countdown
  trackRunning = false;
  trackCountdownVal = 3;
  const overlay = document.getElementById('tracking-countdown');
  overlay.textContent = '3';
  overlay.classList.add('visible');

  trackCountdownTimer = setInterval(() => {
    trackCountdownVal--;
    if (trackCountdownVal <= 0) {
      clearInterval(trackCountdownTimer);
      overlay.classList.remove('visible');
      trackRunning = true;
      trackEndTime = performance.now() + trackDuration * 1000;
      trackLoop();
    } else {
      overlay.textContent = trackCountdownVal;
    }
  }, 900);
}

function resizeTrackCanvas() {
  if (!trackCanvas) return;
  const w = trackCanvas.parentElement.clientWidth;
  const h = Math.min(w * 0.55, 420);
  trackCanvas.width  = w;
  trackCanvas.height = h;
  trackCanvas.style.height = h + 'px';
}

// 터치와 마우스를 하나로 처리하는 pointer 이벤트 함수
function trackPointerMove(e) {
  e.preventDefault();
  const rect = trackCanvas.getBoundingClientRect();
  trackMouse.x = (e.clientX - rect.left) * (trackCanvas.width  / rect.width);
  trackMouse.y = (e.clientY - rect.top)  * (trackCanvas.height / rect.height);
}

let trackLastTime = 0;
let trackWobbleT  = 0;

function trackLoop(ts) {
  if (!trackRunning && !trackAnimId) return;
  trackAnimId = requestAnimationFrame(trackLoop);
  const now = performance.now();
  const dt  = Math.min(now - (trackLastTime || now), 50);
  trackLastTime = now;
  trackWobbleT += dt * 0.001;

  const remaining = Math.max(0, (trackEndTime - now) / 1000);
  document.getElementById('t-time').textContent =
    '0' + Math.floor(remaining / 60) + ':' + String(Math.floor(remaining) % 60).padStart(2,'0');

  const cfg = TRACK_DIFFICULTY[trackDifficulty];

  // 1. 부드러운 방향 전환 로직 (Smooth Steering)
  if (Math.random() < 0.02) { 
    // 간헐적으로 새로운 목표 각도를 설정 (±90도 이내로 제한하여 자연스럽게)
    trackTarget.targetAngle += (Math.random() - 0.5) * Math.PI;
  }
  // 현재 각도가 목표 각도를 향해 부드럽게(Lerp) 따라가도록 함
  trackTarget.angle += (trackTarget.targetAngle - trackTarget.angle) * 0.05;

  trackTarget.vx = Math.cos(trackTarget.angle) * trackTarget.speed;
  trackTarget.vy = Math.sin(trackTarget.angle) * trackTarget.speed;

  // Move target (wobble은 아주 살짝만 유지)
  const wobbleX = Math.sin(trackWobbleT * 2.3) * cfg.wobble * trackCanvas.width;
  const wobbleY = Math.cos(trackWobbleT * 1.7) * cfg.wobble * trackCanvas.height;

  trackTarget.x += trackTarget.vx + wobbleX * dt * 0.1;
  trackTarget.y += trackTarget.vy + wobbleY * dt * 0.1;

  // Bounce (벽에 부딪혔을 때 각도 업데이트)
  let bounced = false;
  if (trackTarget.x - trackTarget.r < 0)   { trackTarget.x = trackTarget.r; trackTarget.vx =  Math.abs(trackTarget.vx); bounced = true; }
  if (trackTarget.x + trackTarget.r > trackCanvas.width)  { trackTarget.x = trackCanvas.width  - trackTarget.r; trackTarget.vx = -Math.abs(trackTarget.vx); bounced = true; }
  if (trackTarget.y - trackTarget.r < 0)   { trackTarget.y = trackTarget.r; trackTarget.vy =  Math.abs(trackTarget.vy); bounced = true; }
  if (trackTarget.y + trackTarget.r > trackCanvas.height) { trackTarget.y = trackCanvas.height - trackTarget.r; trackTarget.vy = -Math.abs(trackTarget.vy); bounced = true; }

  if (bounced) {
    trackTarget.angle = Math.atan2(trackTarget.vy, trackTarget.vx);
    trackTarget.targetAngle = trackTarget.angle;
  }

  // Trail
  trackTrail.push({ x: trackTarget.x, y: trackTarget.y, a: 1 });
  if (trackTrail.length > 20) trackTrail.shift();

  // Check on target (실제 크기보다 판정 범위 20% 확대하여 난이도 완화)
  const dist = Math.hypot(trackMouse.x - trackTarget.x, trackMouse.y - trackTarget.y);
  const hitRadius = trackTarget.r * 1.2; 
  trackOnNow = dist <= hitRadius;

  if (trackRunning) {
    trackTotal++;
    if (trackOnNow) trackOnTarget++;
  }

  const pct = trackTotal ? Math.round(trackOnTarget / trackTotal * 100) : 0;
  document.getElementById('t-pct').textContent = pct;

  drawTracking(now);

  if (remaining <= 0 && trackRunning) {
    trackRunning = false;
    cancelAnimationFrame(trackAnimId);
    trackAnimId = null;
    finishTracking();
  }
}

function drawTracking(now) {
  const ctx = trackCtx;
  const W = trackCanvas.width, H = trackCanvas.height;
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#111118';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Trail
  for (let i = 0; i < trackTrail.length; i++) {
    const t = trackTrail[i];
    const alpha = (i / trackTrail.length) * 0.15;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#4fa8ff';
    ctx.beginPath();
    ctx.arc(t.x, t.y, trackTarget.r * 0.3 * (i / trackTrail.length), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Target glow
  const isOn = trackOnNow;
  const glowColor = isOn ? '#4fffb0' : '#4fa8ff';
  const grd = trackCtx.createRadialGradient(
    trackTarget.x, trackTarget.y, 0,
    trackTarget.x, trackTarget.y, trackTarget.r * 1.6
  );
  grd.addColorStop(0, isOn ? 'rgba(79,255,176,0.25)' : 'rgba(79,168,255,0.18)');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(trackTarget.x, trackTarget.y, trackTarget.r * 1.6, 0, Math.PI*2);
  ctx.fill();

  // Target ring
  ctx.strokeStyle = glowColor;
  ctx.lineWidth = isOn ? 2.5 : 1.5;
  ctx.globalAlpha = isOn ? 1 : 0.6;
  ctx.beginPath();
  ctx.arc(trackTarget.x, trackTarget.y, trackTarget.r, 0, Math.PI*2);
  ctx.stroke();

  // Inner fill
  ctx.fillStyle = isOn ? 'rgba(79,255,176,0.15)' : 'rgba(79,168,255,0.08)';
  ctx.beginPath();
  ctx.arc(trackTarget.x, trackTarget.y, trackTarget.r, 0, Math.PI*2);
  ctx.fill();

  // Center dot
  ctx.fillStyle = glowColor;
  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.arc(trackTarget.x, trackTarget.y, 4, 0, Math.PI*2);
  ctx.fill();

  // Crosshair
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1;
  const cl = trackTarget.r * 0.5;
  ctx.beginPath();
  ctx.moveTo(trackTarget.x - cl, trackTarget.y); ctx.lineTo(trackTarget.x + cl, trackTarget.y);
  ctx.moveTo(trackTarget.x, trackTarget.y - cl); ctx.lineTo(trackTarget.x, trackTarget.y + cl);
  ctx.stroke();

  // Mouse cursor
  if (trackMouse.x > 0) {
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.arc(trackMouse.x, trackMouse.y, 5, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(trackMouse.x - 10, trackMouse.y); ctx.lineTo(trackMouse.x + 10, trackMouse.y);
    ctx.moveTo(trackMouse.x, trackMouse.y - 10); ctx.lineTo(trackMouse.x, trackMouse.y + 10);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Time bar
  const timeLeft = Math.max(0, trackEndTime - now);
  const barW = (timeLeft / (trackDuration * 1000)) * W;
  ctx.fillStyle = 'rgba(79,168,255,0.25)';
  ctx.fillRect(0, H - 4, W, 4);
  ctx.fillStyle = '#4fa8ff';
  ctx.fillRect(0, H - 4, barW, 4);
}

function stopTracking() {
  trackRunning = false;
  clearInterval(trackCountdownTimer);
  if (trackAnimId) { cancelAnimationFrame(trackAnimId); trackAnimId = null; }
  trackCanvas && trackCanvas.removeEventListener('pointerdown', trackPointerMove);
  trackCanvas && trackCanvas.removeEventListener('pointermove', trackPointerMove);
  window.removeEventListener('resize', resizeTrackCanvas);
}

function finishTracking() {
  trackCanvas.removeEventListener('pointerdown', trackPointerMove);
  trackCanvas.removeEventListener('pointermove', trackPointerMove);
  window.removeEventListener('resize', resizeTrackCanvas);

  const pct = trackTotal ? Math.round(trackOnTarget / trackTotal * 100) : 0;

  // Save best (버그 수정: 기록이 없을 경우 null 확인)
  const prevBest = LS.get('best_tracking');
  const isNewBest = prevBest === null || pct > prevBest;
  if (isNewBest) LS.set('best_tracking', pct);

  function trackTier(p) {
    if (p >= 85) return { tier: 'MASTER',   pct: '상위 1%',  cls: 'tier-master' };
    if (p >= 75) return { tier: 'DIAMOND',  pct: '상위 5%',  cls: 'tier-diamond' };
    if (p >= 60) return { tier: 'PLATINUM', pct: '상위 15%', cls: 'tier-platinum' };
    if (p >= 45) return { tier: 'GOLD',     pct: '상위 35%', cls: 'tier-gold' };
    if (p >= 30) return { tier: 'SILVER',   pct: '상위 65%', cls: 'tier-silver' };
    return             { tier: 'BRONZE',   pct: '하위 35%', cls: 'tier-bronze' };
  }

  const t = trackTier(pct);

  showResult({
    modeName: '트래킹 테스트',
    score: pct,
    unit: '%',
    scoreClass: 'tracking-color',
    tier: t,
    isNewBest,
    barPct: pct,
    barClass: 'tracking-fill',
    metrics: [
      { label: 'TRACKING', value: pct + '%', new: isNewBest },
      { label: 'ON TARGET', value: Math.round(trackOnTarget / 60) + 's' },
      { label: 'DURATION', value: trackDuration + 's' },
      { label: 'DIFFICULTY', value: trackDifficulty.toUpperCase() },
    ],
    barLabel: { left: '0%', right: '100%' }
  });
}

/* ══════════════════════════════════════════════════════
   SHOW RESULT
══════════════════════════════════════════════════════ */
function showResult(data) {
  testRunning = false;
  document.getElementById('test-area').classList.remove('visible');
  document.getElementById('home-area').classList.add('hidden');
  document.getElementById('result-area').classList.add('visible');

  if (data.isNewBest) showToast('🏆 신기록 달성!');

  const card = document.getElementById('result-card');

  const metricsHTML = data.metrics.map(m => `
    <div class="result-metric">
      <div class="metric-label">${m.label}</div>
      <div class="metric-value">${m.value}${m.new ? '<span class="metric-new">NEW</span>' : ''}</div>
    </div>
  `).join('');

  card.innerHTML = `
    <div class="result-header">
      <div>
        <div class="result-mode-name">${data.modeName}</div>
        <div class="result-score ${data.scoreClass}">
          ${data.score}<span class="result-unit">${data.unit}</span>
        </div>
      </div>
      <div class="tier-badge">
        <div class="tier-name ${data.tier.cls}">${data.tier.tier}</div>
        <div class="tier-percentile">${data.tier.pct}</div>
      </div>
    </div>
    <div class="result-grid">${metricsHTML}</div>
    <div class="result-bar-wrap">
      <div class="result-bar-label">
        <span>${data.barLabel.left}</span>
        <span>${data.barLabel.right}</span>
      </div>
      <div class="result-bar-bg">
        <div class="result-bar-fill ${data.barClass}" id="result-bar" style="width:0%"></div>
      </div>
    </div>
  `;

  setTimeout(() => {
    const bar = document.getElementById('result-bar');
    if (bar) bar.style.width = data.barPct + '%';
  }, 100);

  updateBestDisplay();
}

/* ══════════════════════════════════════════════════════
   KEYBOARD SHORTCUT
══════════════════════════════════════════════════════ */
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && currentMode === 'reaction') {
    e.preventDefault();
    reactionClick();
  }
  if (e.code === 'Escape' && testRunning) {
    stopTest();
  }
});

/* ══════════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════════ */
init();
</script>
